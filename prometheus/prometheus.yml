# Prometheus 설정 — 어디서(targets) 얼마나 자주(interval) 숫자를 가져올지
global:
  scrape_interval: 15s       # 15초마다 수집
  evaluation_interval: 15s   # 15초마다 알림 규칙 검사

# 알림 규칙 파일 (prometheus/rules/ 아래 .yml 전부)
rule_files:
  - /etc/prometheus/rules/*.yml

# 규칙에 걸리면 Alertmanager로 전달 (같은 compose 네트워크라 컨테이너 이름으로)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 서버 상태 (CPU·메모리·디스크·네트워크)
  # ubuntu-server도 IP로 적음: 컨테이너 안에서 localhost는 "컨테이너 자신"이라서
  - job_name: node
    static_configs:
      - targets: ["192.168.56.101:9100"]
        labels: {host: ubuntu-server}
      - targets: ["192.168.56.102:9100"]
        labels: {host: web02}
      - targets: ["192.168.56.104:9100"]
        labels: {host: web03}

  # Nginx 상태 (접속 수·요청 수)
  - job_name: nginx
    static_configs:
      - targets: ["192.168.56.101:9113"]
        labels: {host: ubuntu-server}
      - targets: ["192.168.56.102:9113"]
        labels: {host: web02}
      - targets: ["192.168.56.104:9113"]
        labels: {host: web03}
